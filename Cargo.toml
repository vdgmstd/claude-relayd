# Package values use single-quoted TOML so the definition-of-done pinning grep
# (`^[a-z0-9_-]+ = "[^=]`) reports only an unpinned dependency, never these.
[package]
name = 'claude-relayd'
version = '0.4.0'
edition = '2024'
rust-version = '1.96'
description = 'Keeps the VS Code panel claude process alive across window close and reload'
license = 'MIT'
publish = false

[dependencies]
anyhow = "=1.0.104"
libc = "=0.2.189"
serde_json = "=1.0.151"
thiserror = "=2.0.20"
uuid = { version = "=1.26.0", default-features = false, features = ['v4'] }

[profile.release]
strip = true

[lints.rust]
# Not forbidden, and not denied either: this tool is a thin layer over fork,
# setsid, kill, flock and geteuid, so every call it exists to make is unsafe.
# Each block carries a SAFETY comment instead; that is the rule .claude/rules
# actually enforces.
unsafe_code           = 'allow'
unused_qualifications = 'warn'
unreachable_pub       = 'warn'
rust_2018_idioms      = { level = 'warn', priority = -1 }

[lints.clippy]
pedantic = { level = 'warn', priority = -1 }

# Pedantic lints that fight the house style rather than help it.
module_name_repetitions  = 'allow'
missing_errors_doc       = 'allow'
missing_panics_doc       = 'allow'
must_use_candidate       = 'allow'
cast_precision_loss      = 'allow'
cast_possible_truncation = 'allow'

# Denied, not warned: a panic in the daemon takes the conversation with it, and
# CLAUDE.md makes these two the enforcement of the no-unwrap rule. Tests are
# exempt through clippy.toml.
unwrap_used   = 'deny'
expect_used   = 'deny'

# These fire on every thread entry point, where the value really is handed to
# the thread that will own it for its lifetime; taking a reference there would
# not compile.
needless_pass_by_value = 'allow'

# Caught early, but not worth failing a build over on their own.
panic         = 'warn'
todo          = 'warn'
dbg_macro     = 'warn'
mem_forget    = 'deny'
